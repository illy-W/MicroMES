services:
  db:
    image: postgres:17.6-alpine
    container_name: micromes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: micromes
      POSTGRES_PASSWORD: micromes
      POSTGRES_DB: micromes
    ports:
      - '5432:5432'
    volumes:
      - micromes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U micromes -d micromes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  micromes-db-data:
