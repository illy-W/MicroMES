# Incluso in ogni location che imposta header propri (add_header in una location sostituisce quelli ereditati).
# TLS, HTTP/2-3 e HSTS vanno gestiti dal reverse proxy davanti a questo container.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Generato in fase di build dell'immagine da scripts/generate-csp.mjs (Report-Only).
include /etc/nginx/csp.conf;
