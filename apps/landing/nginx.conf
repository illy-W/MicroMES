worker_processes auto;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  # Dietro un reverse proxy il container vede solo HTTP: mai redirect assoluti con il suo schema.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Gli URL sconosciuti ricevono un vero 404 (non la home con 200).
    error_page 404 /404.html;

    # Pagina prerenderizzata: no-cache mantiene i validatori (ETag) per risposte 304.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/index.html =404;
    }

    location = /404.html {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=3600" always;
    }

    # /assets non ha hash nel nome (screenshot): rivalidare sempre.
    location ^~ /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=3600, must-revalidate" always;
      access_log off;
    }

    # Output di build con hash (js, css): cache di un anno.
    location ~* \.(?:js|css|woff2?)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
    }
  }
}
