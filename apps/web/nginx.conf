worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  # Dietro un ingress il container vede solo HTTP: mai redirect assoluti.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

  # Nessun proxy /api: l'ingress instrada /api verso l'API.
  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Probe per Kubernetes.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # SPA: index.html non va mai in cache, fallback per le rotte client.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }

    # File con hash nel nome (js, css, font): cache di un anno.
    location ~* \.(?:js|css|woff2?)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      try_files $uri =404;
    }

    # Asset statici senza hash: rivalidare.
    location ~* \.(?:png|jpe?g|svg|ico|webp|avif|gif|txt)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=3600, must-revalidate" always;
      try_files $uri =404;
    }
  }
}
