# Incluso in ogni location che imposta header propri (add_header in una location sostituisce quelli ereditati).
# TLS e HSTS vanno gestiti dall'ingress / reverse proxy davanti a questo container.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Report-Only: l'HTML di Angular usa un onload inline per il CSS critico; passare a enforcing dopo la verifica.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
