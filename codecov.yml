flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      carryforward: true

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "**/Migrations/**"
  - "**/*.Designer.cs"
  - "**/obj/**"
  - "**/bin/**"
  - "libs/api-tests/**"
  - "libs/api-tests-integration/**"
  - "libs/shared/api-client/src/generated/**"
