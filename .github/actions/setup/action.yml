name: Setup workspace
description: Node (da .nvmrc), pnpm, .NET (da global.json), cache pnpm/NuGet e installazione dipendenze.
inputs:
  dotnet:
    description: Installa il .NET SDK e la cache NuGet
    default: 'true'
  restore-tools:
    description: Esegue dotnet tool restore (dotnet-ef)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: actions/setup-dotnet@v5
      if: inputs.dotnet == 'true'
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          **/*.csproj
          NuGet.Config
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Restore .NET tools
      if: inputs.restore-tools == 'true'
      shell: bash
      run: dotnet tool restore
