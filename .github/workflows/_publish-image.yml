name: Publish image (reusable)

# Costruisce, pubblica e firma UNA immagine (api | web | landing) multi-arch.
# Usato da publish-edge, release-app e release-landing. Il chiamante deve concedere:
#   contents: read, packages: write, id-token: write.
on:
  workflow_call:
    inputs:
      image:
        description: Nome immagine (api | web | landing)
        type: string
        required: true
      ref:
        description: Commit/tag da costruire (default il commit del chiamante)
        type: string
        default: ''
      tags:
        description: Tag completi, uno per riga (es. ghcr.io/illy-w/micromes/api:edge)
        type: string
        required: true
      version:
        description: Versione iniettata (build-arg VERSION e InformationalVersion)
        type: string
        required: true
      commit:
        type: string
        required: true
      build-date:
        type: string
        required: true
    outputs:
      digest:
        description: Digest dell'immagine pubblicata
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  publish:
    name: Publish ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # firma keyless con cosign (OIDC)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      NX_NO_CLOUD: 'true'
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Validate image name
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          case "$IMAGE" in api|web|landing) ;; *) echo "::error::image non valida: $IMAGE"; exit 1 ;; esac
      - uses: ./.github/actions/setup
        with:
          dotnet: ${{ inputs.image == 'api' && 'true' || 'false' }}
      # Artefatto costruito una volta (portabile: framework-dependent / statico),
      # poi copiato nelle immagini di tutte le architetture: nessuna emulazione necessaria.
      - name: Build artifact
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          case "$IMAGE" in
            api) npx nx run Api:publish ;;
            web) npx nx build web --configuration=production ;;
            landing) npx nx build landing --configuration=production ;;
          esac
      # Third party: pinnate a SHA.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reference
        id: ref
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}/${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ inputs.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.commit }}
            BUILD_DATE=${{ inputs.build-date }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image digest (cosign keyless)
        env:
          IMAGE_REF: ${{ steps.ref.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${DIGEST}"
      - name: Summary
        env:
          IMAGE_REF: ${{ steps.ref.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ inputs.tags }}
        run: |
          # shellcheck disable=SC2016
          {
            echo "### ${IMAGE_REF}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo "- Versione: \`${VERSION}\`"
            echo '- Tag:'
            echo "$TAGS" | sed 's/^/  - `/; s/$/`/'
            echo
            echo 'Verifica firma:'
            echo
            echo '```sh'
            echo "cosign verify ${IMAGE_REF}@${DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/illy-W/MicroMES/\\.github/workflows/.+@.+\$'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
